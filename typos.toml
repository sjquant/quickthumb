[default.extend-identifiers]
RGBa = "RGBa"

[default.extend-words]
PN = "PN"
PNGs = "PNGs"
ser = "ser"
wdth = "wdth"

[files]
extend-exclude = [
  "assets/fonts/**",
  "tests/snapshots/**",
  "uv.lock",
]

# Preserve the official schema verbatim, including its upstream prose typos.
[type.lottie-schema]
extend-glob = ["schema-1.0.1.json"]
check-file = false
