<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">QuickThumb brand icon</title>
  <desc id="desc">A simplified thumbnail card inside a rounded editor frame on a deep blue tile.</desc>

  <defs>
    <clipPath id="tileClip">
      <rect x="8" y="8" width="104" height="104" rx="28" />
    </clipPath>

    <linearGradient id="tileGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08101E" />
      <stop offset="55%" stop-color="#10213E" />
      <stop offset="100%" stop-color="#15325C" />
    </linearGradient>

    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5B6CFF" />
      <stop offset="58%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#121C33" />
      <stop offset="100%" stop-color="#1D345E" />
    </linearGradient>

    <linearGradient id="sceneGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>

    <linearGradient id="mountainGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#A5B4FC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>
  </defs>

  <g clip-path="url(#tileClip)">
    <rect x="8" y="8" width="104" height="104" rx="28" fill="url(#tileGrad)" />
  </g>
  <rect x="8.75" y="8.75" width="102.5" height="102.5" rx="27.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1.5" />

  <path
    d="M44 28H76A16 16 0 0 1 92 44V76A16 16 0 0 1 76 92H44A16 16 0 0 1 28 76V44A16 16 0 0 1 44 28Z"
    fill="none"
    stroke="url(#frameGrad)"
    stroke-width="6.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M46 32H74A12 12 0 0 1 86 44V76A12 12 0 0 1 74 88H46A12 12 0 0 1 34 76V44A12 12 0 0 1 46 32Z"
    fill="none"
    stroke="#0B1426"
    stroke-opacity="0.42"
    stroke-width="1.75"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <rect x="39" y="37" width="42" height="25" rx="8" fill="url(#cardGrad)" />
  <rect x="41.5" y="39.5" width="37" height="13.5" rx="5" fill="url(#sceneGrad)" />
  <path d="M41.5 53L52.5 44L60 48.5L68 42.5L78.5 53Z" fill="url(#mountainGrad)" />
  <circle cx="67.5" cy="45.5" r="3.1" fill="#F8FAFC" fill-opacity="0.86" />

  <rect x="40" y="68" width="22" height="4.5" rx="2.25" fill="#E2E8F0" fill-opacity="0.9" />
  <rect x="40" y="76" width="14" height="3.5" rx="1.75" fill="#94A3B8" fill-opacity="0.84" />

  <circle cx="73.5" cy="74.5" r="6.5" fill="url(#accentGrad)" />
</svg>
