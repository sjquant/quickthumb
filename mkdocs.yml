        Diagnostics & CLI: 진단과 CLI
        Structured Errors: 구조화된 오류
        Cookbook: 레시피 모음
        Gallery: 갤러리
        Presentations and video: 프레젠테이션과 동영상
        YouTube Thumbnails: YouTube 썸네일
        Instagram Card: Instagram 카드
        Podcast Promo: 팟캐스트 홍보
