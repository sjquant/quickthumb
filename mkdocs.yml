      admonition_translations:
        note: 참고
        warning: 주의
        tip: 팁
        info: 안내
        important: 중요
        danger: 위험
        example: 예제
        abstract: 요약
        question: 질문
        success: 성공
        failure: 실패
        bug: 버그
        quote: 인용
      theme:
        language: ko
        palette:
        - toggle:
            name: 어두운 테마로 전환
        - toggle:
            name: 밝은 테마로 전환
      extra:
        ui:
          main_navigation: 주 탐색
          home: quickthumb 홈
          recipes: 레시피
          docs: 문서
          search: 문서 검색
          open_navigation: 탐색 메뉴 열기
          close_navigation: 탐색 메뉴 닫기
          get_started: 시작하기
          site_navigation: 사이트 탐색
          explore: quickthumb 둘러보기
          shortcuts: 문서 바로가기
          documentation: 문서
          installation: 설치
          concepts: 핵심 개념
          api: API 레퍼런스
          all_docs: 전체 문서
          theme: 테마 전환
          footer: 하단 탐색
          changelog: 변경 기록
          tagline: 이미지, 프레젠테이션, 동영상을 만드는 Python 창작 도구.
          github: GitHub의 quickthumb
          license: MIT 라이선스
          made_with: 제작 도구
          language: 언어
        social_image_alt: 'quickthumb: 코드로 만드는 무한한 썸네일. 예제 썸네일 카드 두 장.'

hooks:
  - docs/hooks/schema.py
  - docs/hooks/seo.py

# Hooks live next to the docs but are build code, not pages.
exclude_docs: |
  hooks/

extra_javascript:
  - javascripts/site.js

extra_css:
  - stylesheets/extra.css

extra:
  ui:
    main_navigation: Main navigation
    home: quickthumb home
    recipes: Recipes
    docs: Docs
    search: Search documentation
    open_navigation: Open navigation
    close_navigation: Close navigation
    get_started: Get started
    site_navigation: Site navigation
    explore: Explore quickthumb
    shortcuts: Documentation shortcuts
    documentation: Documentation
    installation: Installation
    concepts: Core Concepts
    api: API Reference
    all_docs: All documentation
    theme: Switch theme
    footer: Footer
    changelog: Changelog
    tagline: A Python creative toolkit for images, presentations, and video.
    github: quickthumb on GitHub
    license: MIT License
    made_with: Made with
    language: Language
  social_image_alt: 'quickthumb: Endless thumbnails, from code. Two example thumbnail
    cards.'
  social_image_url: https://quickthumb.solaqua.dev/assets/brand/social-preview.png

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      pygments_lang_class: true
      anchor_linenums: true
  - pymdownx.inlinehilite
  # Recipes embed the example scripts directly, so the code shown is the code
  # that rendered the pictured image. check_paths fails the build on a bad path.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - tables
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Getting Started:
      - Render your first cards: getting-started.md
      - Installation: installation.md
      - Core Concepts: concepts.md
      - Choose an output format: output-guide.md
      - Animation Timing: timing.md
  - API Reference:
      - Overview: api/index.md
      - Canvas: api/canvas.md
      - Deck (Multiple Slides): api/deck.md
      - Document Inspection: api/inspection.md
      - Background: api/background.md
      - Text: api/text.md
      - Image: api/image.md
      - Shape: api/shape.md
      - Path: api/path.md
      - SVG: api/svg.md
      - Video: api/video.md
      - Audio-reactive Authoring: api/audio.md
      - Group (Auto Layout): api/group.md
      - Outline: api/outline.md
      - Data visualizations: api/data-visualizations.md
      - Effects: api/effects.md
      - Enums & Gradients: api/enums.md
  - Advanced Reference:
      - Export:
          - Overview: exports.md
          - Methods and receipts: reference/export-methods.md
          - Format fidelity and validation: reference/export-validation.md
          - SVG, HTML, PowerPoint, and PDF: reference/export-documents.md
          - GIF, video, and narration: reference/export-animation.md
          - Transparent video: reference/export-transparency.md
          - Image sequences and render quality: reference/export-frames.md
          - Assets and reproducibility: reference/export-assets.md
          - Lottie vectors: reference/export-lottie.md
      - Animation timing details: reference/timing-details.md
      - Inspecting complex layouts: reference/inspection-details.md
  - JSON & AI:
      - JSON Schema & AI Workflow: json-schema.md
      - Diagnostics & CLI: diagnostics.md
      - Structured Errors: errors.md
  - Cookbook:
      - Gallery: cookbook/index.md
      - Presentations and video: cookbook/decks-and-video.md
      - YouTube Thumbnails: cookbook/youtube-thumbnail.md
      - Instagram Card: cookbook/instagram-card.md
      - Podcast Promo: cookbook/podcast-promo.md
      - Shorts / Vertical Cover: cookbook/shorts-cover.md
      - Launch Announcement (Auto Layout): cookbook/launch-announcement.md
      - AI Workflow: cookbook/ai-workflow.md
      - Webfonts & Background Removal: cookbook/webfonts-rembg.md
  - FAQ: faq.md
  - Changelog:
      - Overview: changelog.md
      - 0.8.0: releases/0.8.0.md
