hooks:
  - docs/hooks/schema.py
  - docs/hooks/seo.py

# Hooks live next to the docs but are build code, not pages.
exclude_docs: |
  hooks/

extra_javascript:
  - javascripts/site.js

extra_css:
  - stylesheets/extra.css

extra:
  ui:
    main_navigation: Main navigation
    home: quickthumb home
    recipes: Recipes
    docs: Docs
    search: Search documentation
    open_navigation: Open navigation
    close_navigation: Close navigation
    get_started: Get started
    site_navigation: Site navigation
    explore: Explore quickthumb
    shortcuts: Documentation shortcuts
    documentation: Documentation
    installation: Installation
    concepts: Core Concepts
    api: API Reference
    all_docs: All documentation
    theme: Switch theme
    footer: Footer
    changelog: Changelog
    tagline: A Python creative toolkit for images, presentations, and video.
    github: quickthumb on GitHub
    license: MIT License
    made_with: Made with
    language: Language
  social_image_alt: 'quickthumb: Endless thumbnails, from code. Two example thumbnail
    cards.'
  social_image_url: https://quickthumb.solaqua.dev/assets/brand/social-preview.png

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      pygments_lang_class: true
      anchor_linenums: true
  - pymdownx.inlinehilite
  # Recipes embed the example scripts directly, so the code shown is the code
  # that rendered the pictured image. check_paths fails the build on a bad path.
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - tables
  - attr_list
  - md_in_html

