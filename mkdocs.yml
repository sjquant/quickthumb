site_name: quickthumb
site_description: Create images, presentations, and animated video with Python or JSON.
site_url: https://quickthumb.solaqua.dev
site_author: Seonu Jang
repo_name: sjquant/quickthumb
repo_url: https://github.com/sjquant/quickthumb

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  custom_dir: docs/overrides
  logo: assets/brand/quickthumb-icon.png
  favicon: assets/brand/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - i18n:
      docs_structure: suffix
      # Shared assets use the default language; the hook rejects untranslated pages.
      fallback_to_default: true
      # Our switch updates on instant navigation and reloads when changing language.
      reconfigure_material: false
      languages:
        - locale: en
          name: English
          default: true
        - locale: ko
          name: 한국어
