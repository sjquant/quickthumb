        Text: 텍스트
        Image: 이미지
        Shape: 도형
        Path: 경로
        SVG: SVG
        Video: 동영상
        Audio-reactive Authoring: 오디오 반응형 제작
        Group (Auto Layout): 그룹(자동 레이아웃)
        Outline: 테두리
