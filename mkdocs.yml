site_name: quickthumb
site_description: Create images, presentations, and animated video with Python or JSON.
site_url: https://quickthumb.solaqua.dev
site_author: Seonu Jang
repo_name: sjquant/quickthumb
repo_url: https://github.com/sjquant/quickthumb

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  custom_dir: docs/overrides
  logo: assets/brand/quickthumb-icon.png
  favicon: assets/brand/favicon.png
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
- search
- i18n:
    docs_structure: suffix
    # Shared assets use the default language; the hook rejects untranslated pages.
    fallback_to_default: true
    # Our switch updates on instant navigation and reloads when changing language.
    reconfigure_material: false
    languages:
    - locale: en
      name: English
      default: true
    - locale: ko
      name: 한국어
      site_description: Python 또는 JSON으로 이미지, 프레젠테이션, 애니메이션 동영상을 만듭니다.
      nav_translations:
        Home: 홈
        Getting Started: 시작하기
        Render your first cards: 첫 카드 렌더링
        Installation: 설치
        Core Concepts: 핵심 개념
        Choose an output format: 출력 형식 선택
        Animation Timing: 애니메이션 타이밍
        API Reference: API 레퍼런스
        Overview: 개요
        Canvas: Canvas
        Deck (Multiple Slides): Deck(여러 슬라이드)
        Document Inspection: 문서 검사
