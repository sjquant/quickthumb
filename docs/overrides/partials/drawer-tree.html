{% macro render(items) %}
  <ul>
    {% for item in items %}
      <li>
        {% if item.children %}
          <details{% if item.active %} open{% endif %}>
            <summary>{{ item.title }}</summary>
            {{ render(item.children) }}
          </details>
        {% else %}
          <a href="{{ item.url | url }}"{% if item.active %} aria-current="page"{% endif %}>{{ item.title }}</a>
        {% endif %}
      </li>
    {% endfor %}
  </ul>
{% endmacro %}
<nav aria-label="All documentation">{{ render(nav.items) }}</nav>
