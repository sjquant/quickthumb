name: Automated Release Process

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync --locked --extra cli --extra svg --extra pptx --extra pdf --dev

      - name: Install native rendering dependencies
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg libcairo2

      - name: Test
        # Quality CI owns coverage; release validation should not inherit the
        # project-wide pytest-cov addopts and combine incompatible data files.
        run: uv run --locked pytest tests/ --ignore=tests/test_rendering.py --no-cov

      - name: Determine Version Change
        id: version_check
        run: |
          VERSION="v$(uv version --short)"
          echo "Current version: ${VERSION}"

          LATEST_RELEASE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r '.tag_name')
          echo "Latest release version: ${LATEST_RELEASE}"

          if [ "${VERSION}" != "${LATEST_RELEASE}" ]; then
            echo "version_changed=true" >> "${GITHUB_OUTPUT}"
            echo "new_version=${VERSION}" >> "${GITHUB_OUTPUT}"
          else
            echo "version_changed=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create Release
        if: steps.version_check.outputs.version_changed == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version_check.outputs.new_version }}
          generate_release_notes: True

      - name: mint API token
        id: mint-token
        run: |
          # retrieve the ambient OIDC token
          resp=$(curl -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=pypi")
          oidc_token=$(jq -r '.value' <<< "${resp}")

          # exchange the OIDC token for an API token
          resp=$(curl -X POST https://pypi.org/_/oidc/mint-token -d "{\"token\": \"${oidc_token}\"}")
          api_token=$(jq -r '.token' <<< "${resp}")

          # mask the newly minted API token, so that we don't accidentally leak it
          echo "::add-mask::${api_token}"

          # see the next step in the workflow for an example of using this step output
          echo "api-token=${api_token}" >> "${GITHUB_OUTPUT}"

      - name: Build package
        if: steps.version_check.outputs.version_changed == 'true'
        run: uv build

      - name: Check installed wheel
        if: steps.version_check.outputs.version_changed == 'true'
        run: |
          # Install only the built wheel into a clean Python 3.10 environment, with no extras.
          uv venv --python 3.10 "${RUNNER_TEMP}/wheel-check"
          uv pip install --python "${RUNNER_TEMP}/wheel-check/bin/python" dist/*.whl

          # Run from outside the checkout so the source tree cannot shadow the installed package.
          cd "${RUNNER_TEMP}"
          "${RUNNER_TEMP}/wheel-check/bin/python" - <<'PY'
          import tempfile
          from pathlib import Path

          import quickthumb
          from quickthumb import Canvas
          from quickthumb.errors import RenderingError

          assert "wheel-check" in quickthumb.__file__, quickthumb.__file__

          with tempfile.TemporaryDirectory() as directory:
              output = Path(directory)
              canvas = Canvas(128, 96).background(color="#ff0000")
              canvas.export(output / "wheel.png")
              assert (output / "wheel.png").stat().st_size > 0

              # HTML export reads the packaged templates and assets, so a wheel missing them fails here.
              canvas.export(output / "wheel.html")
              html = (output / "wheel.html").read_text(encoding="utf-8")
              assert "qt-stage" in html and "{{" not in html, "HTML export lost packaged assets"

              # Without the pdf extra, export must fail with the install hint.
              try:
                  canvas.export(output / "wheel.pdf")
              except RenderingError as error:
                  assert "quickthumb[pdf]" in str(error), str(error)
              else:
                  raise SystemExit("PDF export succeeded without the pdf extra")

          print("installed wheel: PNG and HTML export work and missing extras report their install hint")
          PY

      - name: Publish to PyPI
        if: steps.version_check.outputs.version_changed == 'true'
        env:
          UV_PUBLISH_TOKEN: ${{ steps.mint-token.outputs.api-token }}
        run: uv publish --token "$UV_PUBLISH_TOKEN"
