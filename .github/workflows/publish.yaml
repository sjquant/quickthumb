name: Automated Release Process

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync --locked --extra cli --extra svg --extra pptx --extra pdf --dev

      - name: Test
        # Quality CI owns coverage; release validation should not inherit the
        # project-wide pytest-cov addopts and combine incompatible data files.
        run: uv run --locked pytest tests/ --ignore=tests/test_rendering.py --no-cov

      - name: Determine Version Change
        id: version_check
        run: |
          VERSION="v$(uv version --short)"
          echo "Current version: ${VERSION}"

          LATEST_RELEASE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/releases/latest" | jq -r '.tag_name')
          echo "Latest release version: ${LATEST_RELEASE}"

          if [ "${VERSION}" != "${LATEST_RELEASE}" ]; then
            echo "version_changed=true" >> "${GITHUB_OUTPUT}"
            echo "new_version=${VERSION}" >> "${GITHUB_OUTPUT}"
          else
            echo "version_changed=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create Release
        if: steps.version_check.outputs.version_changed == 'true'
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.version_check.outputs.new_version }}
          generate_release_notes: True

      - name: mint API token
        id: mint-token
        run: |
          # retrieve the ambient OIDC token
          resp=$(curl -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=pypi")
          oidc_token=$(jq -r '.value' <<< "${resp}")

          # exchange the OIDC token for an API token
          resp=$(curl -X POST https://pypi.org/_/oidc/mint-token -d "{\"token\": \"${oidc_token}\"}")
          api_token=$(jq -r '.token' <<< "${resp}")

          # mask the newly minted API token, so that we don't accidentally leak it
          echo "::add-mask::${api_token}"

          # see the next step in the workflow for an example of using this step output
          echo "api-token=${api_token}" >> "${GITHUB_OUTPUT}"

      - name: Build and publish to PyPI
        if: steps.version_check.outputs.version_changed == 'true'
        env:
          UV_PUBLISH_TOKEN: ${{ steps.mint-token.outputs.api-token }}
        run: |
          uv build
          uv publish --token "$UV_PUBLISH_TOKEN"
