name: Quality and Test CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync --locked --extra cli --extra svg --extra pptx --extra pdf --dev

      - name: Format check
        run: uv run --locked ruff format --check .

      - name: Lint
        run: uv run --locked ruff check .

      - name: Type check
        run: uv run --locked ty check quickthumb --output-format concise

      - name: Pre-commit checks
        run: uv run --locked pre-commit run --all-files --show-diff-on-failure

      - name: Build package
        run: uv build

      - name: Check HTML asset size
        run: |
          uv run --locked python - <<'PY'
          from pathlib import Path

          limit = 64 * 1024
          paths = list(Path("quickthumb/html").glob("*.css"))
          paths += list(Path("quickthumb/html").glob("*.js"))
          total = sum(path.stat().st_size for path in paths)
          if total > limit:
              raise SystemExit(f"HTML assets are {total} bytes, above {limit} bytes")
          print(f"HTML assets are {total} bytes, under {limit} bytes")
          PY

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync --locked --extra cli --extra svg --extra pptx --extra pdf --dev

      - name: Test with coverage
        run: |
          uv run --locked pytest tests/ \
            --ignore=tests/test_rendering.py \
            --cov=quickthumb \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Diff coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          uv run --locked diff-cover coverage.xml \
            --compare-branch="$BASE_REF" \
            --show-uncovered \
            --fail-under=80
