name: Quality and Test CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lottie-player:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      - name: Install reference dependencies
        run: |
          uv sync --locked --extra lottie --dev
          npm ci --prefix tests/fixtures/lottie/player --ignore-scripts --no-audit --no-fund

      - name: Compare actual Lottie player frames
        run: |
          PYTHONPATH=. uv run --locked python scripts/check_lottie_fidelity.py \
            --chrome "$(command -v google-chrome)" \
            --player tests/fixtures/lottie/player/node_modules/lottie-web/build/player/lottie.min.js \
            --output "$RUNNER_TEMP/lottie-reference"

      - name: Retain reference images and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lottie-reference
          path: ${{ runner.temp }}/lottie-reference
          if-no-files-found: warn

  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked --extra cli --extra svg --extra pptx --extra pdf --dev

      - name: Format check
        run: uv run --locked ruff format --check .

      - name: Lint
        run: uv run --locked ruff check .

      - name: Type check
        run: uv run --locked ty check quickthumb tests --output-format concise

      - name: Pre-commit checks
        run: uv run --locked pre-commit run --all-files --show-diff-on-failure

      - name: Build package
        run: uv build

      - name: Check HTML asset size
        run: |
          uv run --locked python - <<'PY'
          from pathlib import Path

          limit = 64 * 1024
          paths = list(Path("quickthumb/html").glob("*.css"))
          paths += list(Path("quickthumb/html").glob("*.js"))
          total = sum(path.stat().st_size for path in paths)
          if total > limit:
              raise SystemExit(f"HTML assets are {total} bytes, above {limit} bytes")
          print(f"HTML assets are {total} bytes, under {limit} bytes")
          PY

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked --extra cli --extra svg --extra pptx --extra pdf --dev

      - name: Install native rendering dependencies
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg libcairo2

      - name: Test with coverage
        run: |
          uv run --locked pytest tests/ \
            --ignore=tests/test_rendering.py \
            --cov=quickthumb \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Diff coverage
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          uv run --locked diff-cover coverage.xml \
            --compare-branch="$BASE_REF" \
            --show-uncovered \
            --fail-under=80
