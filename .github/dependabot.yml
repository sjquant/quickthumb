version: 2
updates:
  # The uv ecosystem updates pyproject.toml and uv.lock together, so a merged
  # update is what `uv sync --locked` installs in CI.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
